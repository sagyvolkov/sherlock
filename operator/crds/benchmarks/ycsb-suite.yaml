apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sherlockycsbbenchsuites.sherlock.io
  annotations:
    sherlock.io/description: "Parameter-sweep suite for YCSB (MongoDB)"
spec:
  group: sherlock.io
  scope: Namespaced
  names:
    plural: sherlockycsbbenchsuites
    singular: sherlockycsbbenchsuite
    kind: SherlockYCSBSuite
    shortNames:
      - slycsb
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Runs
          type: string
          jsonPath: .status.summary.runsCompleted
        - name: Failed
          type: string
          jsonPath: .status.summary.runsFailed
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [database, execution, sweep, artifacts]
              properties:

                database:
                  type: object
                  required: [instancesPerNode, storageSize]
                  properties:
                    type:
                      type: string
                      enum: [mongodb]
                      default: mongodb
                    instancesPerNode:
                      type: integer
                      minimum: 1
                      maximum: 8
                      default: 1
                    storageClass:
                      type: string
                      default: ""
                    storageSize:
                      type: string
                      pattern: '^[0-9]+[KMGT]i$'
                    volumes:
                      type: object
                      description: >
                        How the database PVCs are named and whether they outlive the suite.
                        PVCs are <namePrefix>-pvc-N. After a successful data load each PVC
                        records the layout it was prepared for (count, instancesPerNode,
                        workers, storage class and size, dataset params). A later suite with
                        the same namePrefix reuses the PVCs, and skips the data load, only if
                        all of them exist, are Bound and match its layout exactly; otherwise
                        every PVC with that prefix is deleted and the set is created fresh.
                      properties:
                        namePrefix:
                          type: string
                          maxLength: 40
                          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
                          description: >
                            Prefix for PVC names (default: the database type)
                            and for the database Deployments and Services (<namePrefix>-N).
                            Not tied to the suite name, so the next suite can find the PVCs.
                            Two suites using the same prefix run one after the other.
                        onSuiteDelete:
                          type: string
                          enum: [retain, delete]
                          default: retain
                          description: >
                            retain: keep the PVCs (and the prepared data) when the suite is
                            deleted. delete: delete them, unless a later suite has taken them over.
                        onCreate:
                          type: string
                          enum: [reuse, recreate]
                          default: reuse
                          description: >
                            reuse: reuse matching prepared PVCs. recreate: always delete and
                            recreate them, which also forces a fresh data load.
                    credentialsSecret:
                      type: string
                      description: >
                        Secret with keys username, password, dbName (default:
                        sherlock-db-credentials, created with defaults if missing).
                        MSSQL uses the password with user sa and database tpcc.
                        If omitted, default dev credentials are used — not for production.
                    storagePlugin:
                      type: string
                      enum: [generic, lightbits, odf, portworx]
                      default: generic
                    resources:
                      type: object
                      properties:
                        requests:
                          type: object
                          properties:
                            cpu:
                              type: string
                              default: "2"
                            memory:
                              type: string
                              default: "4Gi"
                        limits:
                          type: object
                          properties:
                            cpu:
                              type: string
                              default: "4"
                            memory:
                              type: string
                              default: "8Gi"
                    nodeSelector:
                      type: object
                      additionalProperties:
                        type: string
                    tolerations:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                            enum: [Exists, Equal]
                          value:
                            type: string
                          effect:
                            type: string
                            enum: [NoSchedule, PreferNoSchedule, NoExecute]

                execution:
                  type: object
                  properties:
                    clientResources:
                      type: object
                      description: >
                        CPU and memory for the benchmark client pods: the prepare
                        (data load) Jobs and the benchmark run Jobs. Kept separate
                        from database.resources, which applies to the database pods.
                        Data generation is CPU bound (HammerDB in particular), and
                        HammerDB uses one loader virtual user per CPU of limits.cpu.
                        If omitted, the client pods use database.resources.
                      properties:
                        requests:
                          type: object
                          properties:
                            cpu:
                              type: string
                            memory:
                              type: string
                        limits:
                          type: object
                          properties:
                            cpu:
                              type: string
                            memory:
                              type: string
                    order:
                      type: string
                      enum: [sequential, parallel]
                      default: sequential
                    sleepBetweenRuns:
                      type: integer
                      minimum: 0
                      default: 30
                    failurePolicy:
                      type: string
                      enum: [abortAll, retryN, continueAndReport]
                      default: abortAll
                    retryLimit:
                      type: integer
                      minimum: 1
                      maximum: 10
                      default: 3
                    timeoutPerRun:
                      type: string
                      pattern: '^[0-9]+(m|h)$'
                      default: "1h"

                sweep:
                  type: object
                  required: [threads, workload, recordCount, operationCount]
                  description: >
                    YCSB-specific sweep axes.
                    workload maps to the YCSB built-in workloads:
                      a: 50% read / 50% update
                      b: 95% read /  5% update
                      c: 100% read
                      d: 95% read /  5% insert (latest distribution)
                      e: 95% scan  /  5% insert
                      f: 50% read  / 50% read-modify-write
                    These are the standard YCSB workload letters used in research.
                  properties:
                    threads:
                      type: array
                      minItems: 1
                      items:
                        type: integer
                        minimum: 1
                        maximum: 1024
                      description: "YCSB -threads: concurrent client threads"
                      example: [4, 8, 16]
                    workload:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        enum: [a, b, c, d, e, f]
                      description: "YCSB workload letter — defines read/write/scan mix"
                      example: [a, b, c]
                    recordCount:
                      type: array
                      minItems: 1
                      items:
                        type: integer
                        minimum: 1000
                      description: "YCSB -p recordcount: number of records in the dataset"
                      example: [1000000]
                    operationCount:
                      type: array
                      minItems: 1
                      items:
                        type: integer
                        minimum: 1000
                      description: "YCSB -p operationcount: number of operations to execute per run"
                      example: [100000]
                    requestDistribution:
                      type: array
                      items:
                        type: string
                        enum: [uniform, zipfian, hotspot, sequential, exponential, latest]
                      default: [uniform]
                      description: >
                        YCSB -p requestdistribution: how keys are selected.
                        zipfian models real-world skewed access patterns (hot keys).
                        uniform is the default and most reproducible.
                    maxExecutionTime:
                      type: integer
                      minimum: 10
                      default: 120
                      description: >
                        YCSB -p maxexecutiontime: cap run duration in seconds regardless
                        of operationCount. Not a sweep axis — single integer.

                artifacts:
                  type: object
                  required: [destination]
                  properties:
                    collectStats:
                      type: boolean
                      default: true
                    statsIntervalSeconds:
                      type: integer
                      minimum: 1
                      default: 10
                      description: >
                        Seconds between stat samples (iostat / vmstat / mpstat
                        interval). Totals are rate x sample length, so the interval
                        only sets the time resolution of the raw data.
                    statsMarginSeconds:
                      type: integer
                      minimum: 0
                      default: 30
                      description: >
                        Collection time added to the benchmark runtime, so the
                        whole run falls inside the window even if the benchmark
                        pods start late. Rates are always totals divided by the
                        benchmark runtime, not by the window.
                    statsDevicePattern:
                      type: string
                      description: >
                        Regex selecting the block devices whose iostat counters go
                        into the storage* result metrics. Default ^nvme\d+n\d+$:
                        NVMe namespace heads, without multipath path devices
                        (nvme0c0n1) that repeat the same I/O. Set it if the nodes'
                        own disks are NVMe or the storage uses other devices.
                    statsNetworkInterfaces:
                      type: array
                      items:
                        type: string
                      description: >
                        Node interfaces that carry storage traffic (e.g. bond0.100).
                        Their RX/TX bytes are totalled into the net* result metrics.
                        Per-interface bytes for all interfaces are always kept in
                        result.storageByNode.
                    compression:
                      type: string
                      enum: [gzip, zstd, none]
                      default: gzip
                    destination:
                      type: object
                      required: [type]
                      properties:
                        type:
                          type: string
                          enum: [pvc, s3, local]
                        pvc:
                          type: object
                          description: >
                            Bundles are written to PVC <suite>-artifacts (created on the
                            first run, kept when the suite is deleted) under
                            <suite>-<uid prefix>/<run>.tar.gz by a short writer Job, and
                            recorded as pvc://<pvc>/<path> in status.artifacts.bundles.
                            To copy them out, mount the PVC in a pod and use oc cp.
                          properties:
                            storageClass:
                              type: string
                              default: ""
                            size:
                              type: string
                              pattern: '^[0-9]+[KMGT]i$'
                              default: "20Gi"
                            accessMode:
                              type: string
                              enum: [ReadWriteOnce, ReadWriteMany]
                              default: ReadWriteOnce
                        s3:
                          type: object
                          properties:
                            endpoint:
                              type: string
                            bucket:
                              type: string
                            prefix:
                              type: string
                              default: "sherlock/{{.SuiteName}}/"
                            credentialsSecret:
                              type: string
                            checksumVerification:
                              type: boolean
                              default: true
                        local:
                          type: object
                          properties:
                            ttlHours:
                              type: integer
                              minimum: 1
                              maximum: 168
                              default: 24
                    retention:
                      type: object
                      properties:
                        keepLastN:
                          type: integer
                          minimum: 1
                        ttlDays:
                          type: integer
                          minimum: 1

            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Deploying, Ready, Running, Sleeping,
                         Collecting, Completed, Degraded, Failed]
                nextRunAt:
                  type: string
                  format: date-time
                  description: >-
                    While phase is Sleeping, when the next run starts
                    (completion time + execution.sleepBetweenRuns).
                observedGeneration:
                  type: integer
                runMatrix:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      params:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      phase:
                        type: string
                        enum: [Pending, Running, Completed, Failed, Retrying]
                      startTime:
                        type: string
                        format: date-time
                      completionTime:
                        type: string
                        format: date-time
                      retryCount:
                        type: integer
                        default: 0
                      artifactPath:
                        type: string
                      benchmarkJobs:
                        type: array
                        description: Names of the benchmark Jobs launched for this run.
                        items:
                          type: string
                      statJobs:
                        type: array
                        description: Names of the stat collector Jobs launched for this run.
                        items:
                          type: string
                      statNodes:
                        type: object
                        description: Node each stat collector Job ran on (Job name → node).
                        additionalProperties:
                          type: string
                      instanceResults:
                        type: array
                        description: >-
                          Parsed result of each benchmark Job (one per DB instance or
                          PVC). result holds these combined: throughput summed, average
                          latency weighted by throughput, percentiles from the slowest.
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      result:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        properties:
                          throughputOpsPerSec:
                            type: number
                            description: YCSB primary metric — overall ops/sec
                          readLatencyAvgUs:
                            type: number
                            description: Average read latency in microseconds (YCSB native unit)
                          readLatencyP95Us:
                            type: number
                          readLatencyP99Us:
                            type: number
                          updateLatencyAvgUs:
                            type: number
                          updateLatencyP95Us:
                            type: number
                          avgReadIops:
                            type: number
                          avgWriteIops:
                            type: number
                          avgReadBwMBs:
                            type: number
                          avgWriteBwMBs:
                            type: number
                          avgLatencyMs:
                            type: number
                          p95LatencyMs:
                            type: number
                          p99LatencyMs:
                            type: number
                volumes:
                  type: object
                  description: PVC set used by this suite (see spec volumes).
                  properties:
                    namePrefix:
                      type: string
                    pvcNames:
                      type: array
                      items:
                        type: string
                    reused:
                      type: boolean
                      description: True if the PVCs were left by an earlier suite with the same layout.
                    layout:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                deployments:
                  type: array
                  description: Database instances deployed by on_create.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      node:
                        type: string
                      pvc:
                        type: string
                      index:
                        type: integer
                      ip:
                        type: string
                dbCredentials:
                  type: object
                  description: Non-sensitive DB connection fields (password is never stored).
                  properties:
                    username:
                      type: string
                    dbName:
                      type: string
                summary:
                  type: object
                  properties:
                    totalRuns:
                      type: integer
                    runsCompleted:
                      type: integer
                    runsFailed:
                      type: integer
                    runsRemaining:
                      type: integer
                    currentRunName:
                      type: string
                artifacts:
                  type: object
                  properties:
                    pvcName:
                      type: string
                    bundles:
                      type: array
                      items:
                        type: object
                        properties:
                          runName:
                            type: string
                          path:
                            type: string
                          sizeBytes:
                            type: integer
                          collectedAt:
                            type: string
                            format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        enum: [DatabaseReady, SweepRunning, ArtifactsAvailable, Failed]
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
