# Sherlock database credential Secrets
# Create these before applying any Suite CR.
#
# Usage:
#   kubectl apply -f db-credentials.yaml -n sherlock
#
# Then reference in your Suite spec:
#   spec:
#     database:
#       credentialsSecret: sherlock-pg-creds
#
# IMPORTANT: In production, do not store passwords in plain YAML files.
# Use an external secrets manager (Vault, AWS Secrets Manager, Sealed Secrets)
# or create the Secret imperatively:
#   kubectl create secret generic sherlock-pg-creds \
#     --from-literal=username=sherlock \
#     --from-literal=password=<your-password> \
#     --from-literal=dbName=sherlock \
#     -n sherlock

---
# PostgreSQL / pgbench credentials
apiVersion: v1
kind: Secret
metadata:
  name: sherlock-pg-creds
  namespace: sherlock
type: Opaque
stringData:
  username: sherlock
  password: changeme
  dbName:   sherlock

---
# MySQL / sysbench credentials
apiVersion: v1
kind: Secret
metadata:
  name: sherlock-mysql-creds
  namespace: sherlock
type: Opaque
stringData:
  username: sherlock
  password: changeme
  dbName:   sherlock

---
# MSSQL / HammerDB credentials
# saPassword must meet SQL Server complexity requirements:
#   min 8 chars, upper+lower+digit+special
apiVersion: v1
kind: Secret
metadata:
  name: sherlock-mssql-creds
  namespace: sherlock
type: Opaque
stringData:
  username:   sa
  password:   Sherlock1!
  dbName:     tpcc
  saPassword: Sherlock1!

---
# MongoDB / YCSB credentials
apiVersion: v1
kind: Secret
metadata:
  name: sherlock-mongo-creds
  namespace: sherlock
type: Opaque
stringData:
  username: sherlock
  password: changeme
  dbName:   sherlock
