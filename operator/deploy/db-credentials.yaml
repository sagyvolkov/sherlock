# Database credentials shared by all Sherlock suites (optional: the operator
# creates this Secret with these defaults if it doesn't exist).
#
#   kubectl apply -f db-credentials.yaml -n sherlock
#
# One password for every database type; MSSQL uses it as the sa password,
# so it must meet SQL Server complexity rules (8+ chars, upper, lower, digit,
# symbol). A suite can use another Secret via spec.database.credentialsSecret.
apiVersion: v1
kind: Secret
metadata:
  name: sherlock-db-credentials
  namespace: sherlock
type: Opaque
stringData:
  username: sherlock
  password: Sherlock1!
  dbName:   sherlock
